<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>RustCore Wallet</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Self-custodial wallet for the Massa blockchain.">
  <meta name="theme-color" content="#07070a">
  <!-- Same policy as the browser extension (src/extension/manifest.json, minus frame-ancestors,
       which a <meta> can't set); csp.spec.ts keeps them equal. Remote media: media-hosts.ts. -->
  <meta http-equiv="Content-Security-Policy" content="script-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; connect-src 'self' https://mainnet.massa.net https://buildnet.massa.net https://explorer-api.massa.net https://ipfs.io https://nft.rustcoremassa.com; img-src 'self' data: https://ipfs.io https://nft.rustcoremassa.com">

  <!-- Installable app (PWA) -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="RustCore">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body>
  <app-root></app-root>
  <noscript>RustCore Wallet needs JavaScript to run.</noscript>
</body>
</html>
