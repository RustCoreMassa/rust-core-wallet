<div class="modal">
<div class="modal-head">
  <div class="modal-title">Receive</div>
  <button class="modal-close" type="button" (click)="modal.close()">✕</button>
</div>

<div class="qr-wrap">
  <qr-code
    [value]="address()"
    size="180"
    errorCorrectionLevel="M"
    [margin]="2"
    darkColor="#0a0a0aff"
    lightColor="#f6f6f8ff"
  />
</div>

<div class="field-label">Your address</div>
<div class="addr-box">{{ address() }}</div>

<div class="copy-row">
  <button class="btn btn-red" type="button" (click)="copyAddress()">Copy address</button>
</div>

<div class="hint">Only send MAS and Massa-standard tokens to this address.</div>
</div>
