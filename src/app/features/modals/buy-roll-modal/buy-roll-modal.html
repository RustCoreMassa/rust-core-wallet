<div class="modal">
<div class="modal-head">
  <div class="modal-title">{{ step() === 'confirm' ? 'Confirm roll purchase' : 'Buy roll' }}</div>
  <button class="modal-close" type="button" (click)="modal.close()">✕</button>
</div>

@if (step() === 'form') {
<label class="field-label" for="buy-roll-count">
  Number of rolls
  <span style="float:right;color:var(--gray-500);">{{ rollPrice }} MAS / roll</span>
</label>
<div class="field-row">
  <input
    id="buy-roll-count"
    class="num-input"
    type="number"
    inputmode="numeric"
    min="1"
    step="1"
    [ngModel]="count()"
    (ngModelChange)="count.set($event)"
    (keydown)="blockNonDigitKeys($event)"
  />
</div>
<div class="hint">Cost: {{ cost() }} MAS + {{ networkFee }} MAS fee</div>

@if (error()) {
<div class="error-text">{{ error() }}</div>
}

<button class="btn btn-red" type="button" (click)="review()">Review</button>
} @else {
<app-confirm-details
  [rows]="confirmRows()"
  [busy]="isBuying()"
  confirmLabel="Confirm & buy"
  busyLabel="Confirming on-chain…"
  (confirmed)="confirm()"
  (cancelled)="step.set('form')"
/>

@if (error()) {
<div class="error-text">{{ error() }}</div>
}
}
</div>
