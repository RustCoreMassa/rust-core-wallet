<div class="view-header">Settings</div>

<div class="field-label" style="padding:0 20px;">Wallet</div>
<div class="settings-list" style="padding-top:0;">
  @if (activeAccount(); as account) {
  <button class="wallet-row" type="button" style="padding:12px 4px;" (click)="openRename(account)">
    <div class="wallet-avatar" [style.background]="'linear-gradient(155deg, ' + avatarColors(0)[0] + ', ' + avatarColors(0)[1] + ')'">
      {{ initials(account.name) }}
    </div>
    <div class="wallet-main">
      <div class="wallet-name">{{ account.name }}</div>
      <div class="wallet-addr">{{ account.address | shortAddress }}</div>
    </div>
    <svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none">
      <path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" />
    </svg>
  </button>
  }
</div>

<div class="settings-list">
  <button class="settings-row" type="button" (click)="modal.open('wallets')">
    <div>
      <div class="label">Wallets</div>
      <div class="sub">{{ walletsCountLabel() }}</div>
    </div>
    <svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none">
      <path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" />
    </svg>
  </button>

  <button class="settings-row" type="button" (click)="toggleNetwork()">
    <div>
      <div class="label">Network</div>
      <div class="sub">{{ isBuildnet() ? 'Buildnet' : 'Mainnet' }}</div>
    </div>
    <div class="switch" [class.on]="isBuildnet()"></div>
  </button>

  @if (sidePanel; as panel) {
  <button class="settings-row" type="button" (click)="panel.open()">
    <div>
      <div class="label">Open in side panel</div>
      <div class="sub">Full height, next to the page you're on</div>
    </div>
    <svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none">
      <path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" />
    </svg>
  </button>
  }

  <button class="settings-row" type="button" (click)="backupPhrase()">
    <div>
      <div class="label">Backup private key</div>
      <div class="sub">Keep it offline and private</div>
    </div>
    <svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none">
      <path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" />
    </svg>
  </button>

  <button class="settings-row" type="button" (click)="lockWallet()">
    <div>
      <div class="label">Lock wallet</div>
      <div class="sub">Requires your 6-digit PIN</div>
    </div>
    <svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none">
      <path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" />
    </svg>
  </button>

  <button class="settings-row" type="button" (click)="logOut()">
    <div>
      <div class="label">Log out</div>
      <div class="sub">Removes all wallets from this device</div>
    </div>
    <svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none">
      <path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" />
    </svg>
  </button>
</div>
