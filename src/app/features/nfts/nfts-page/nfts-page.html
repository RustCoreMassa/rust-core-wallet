<div class="view-header">NFTs</div>

<div class="field-label section-label">Domains (MNS)</div>
<div class="settings-list">
  @if (domains(); as domains) {
  @if (domains.length > 0) {
  @for (domain of domains; track domain.name) {
  <div class="settings-row">
    <div class="label">{{ domain.name }}.massa</div>
  </div>
  }
  } @else {
  <div class="empty-state">No domains owned by this wallet</div>
  }
  } @else if (hasError()) {
  <div class="empty-state">Couldn't load domains</div>
  } @else {
  <div class="empty-state">Loading domains…</div>
  }
</div>

<div class="field-label section-label">NFTs</div>
<div class="empty-state">Coming soon</div>
