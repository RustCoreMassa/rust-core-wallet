@if (kind === 'pin') {
<div class="pin-dots" [class.compact]="compact()">
  @for (filled of dots(); track $index) {
  <div class="pin-dot" [class.filled]="filled"></div>
  }
</div>

<app-pin-pad (digit)="onDigit($event)" (backspace)="onBackspace()" />
} @else {
<form class="password-form" (submit)="submitPassword($event)">
  <div class="password-field">
    <input
      #field
      class="num-input"
      aria-label="Password"
      placeholder="Password"
      autocomplete="current-password"
      [type]="shown() ? 'text' : 'password'"
      [value]="value()"
      (input)="onInput($event)"
    />
    <button class="reveal" type="button" [attr.aria-pressed]="shown()" (click)="shown.set(!shown())">
      {{ shown() ? 'Hide' : 'Show' }}
    </button>
  </div>
  <button class="btn btn-red" type="submit" [disabled]="busy() || !value()">
    @if (busy()) {
    <div class="spinner"></div>
    <span>Checking…</span>
    } @else {
    <span>{{ submitLabel() }}</span>
    }
  </button>
</form>
}
