<div class="dropdown">
  <button
    #trigger
    class="select-fake dropdown-trigger"
    type="button"
    aria-haspopup="listbox"
    [attr.id]="inputId()"
    [attr.aria-expanded]="open()"
    (click)="toggle()"
  >
    @if (selected(); as option) {
    <ng-container *ngTemplateOutlet="lead; context: { $implicit: option }" />
    <span class="dropdown-label">{{ option.label }}</span>
    }
    <span class="dropdown-chevron" [class.open]="open()"></span>
  </button>

  @if (open() && position(); as pos) {
  <div
    class="dropdown-menu"
    role="listbox"
    [class.above]="pos.bottom !== null"
    [style.left.px]="pos.left"
    [style.width.px]="pos.width"
    [style.top.px]="pos.top"
    [style.bottom.px]="pos.bottom"
    [style.max-height.px]="pos.maxHeight"
  >
    @for (option of options(); track option.value) {
    <button
      class="dropdown-option"
      type="button"
      role="option"
      [attr.aria-selected]="option.value === value()"
      [class.selected]="option.value === value()"
      (click)="pick(option.value)"
    >
      <ng-container *ngTemplateOutlet="lead; context: { $implicit: option }" />
      <span class="dropdown-names">
        <span class="dropdown-label">{{ option.label }}</span>
        @if (option.sublabel) {
        <span class="dropdown-sublabel">{{ option.sublabel }}</span>
        }
      </span>
      @if (option.trailing) {
      <span class="dropdown-trailing">{{ option.trailing }}</span>
      }
    </button>
    }
  </div>
  }
</div>

<ng-template #lead let-option>
  @if (option.icon && !failedIcons().has(option.icon)) {
  <img
    class="dropdown-icon"
    [src]="option.icon"
    alt=""
    referrerpolicy="no-referrer"
    (error)="iconFailed(option.icon)"
  />
  } @else if (option.avatar) {
  <span class="dropdown-avatar" [style.background]="option.avatar.background">{{ option.avatar.text }}</span>
  }
</ng-template>
