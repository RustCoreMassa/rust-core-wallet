<div class="row">
  <div class="row-icon" [class]="iconClass()">{{ iconLabel() }}</div>
  <div class="row-main">
    <div class="row-name">{{ meta().name }}</div>
    <div class="row-sub">
      {{ price() | currency: 'USD' : 'symbol' : '1.2-2' }}
      <span [class.pos]="changePct() >= 0" [class.neg]="changePct() < 0">
        {{ changePct() >= 0 ? '+' : '' }}{{ changePct() | number: '1.2-2' }}%
      </span>
    </div>
  </div>
  <div class="row-values">
    <div class="row-usd">{{ usdValue() | currency: 'USD' : 'symbol' : '1.2-2' }}</div>
    <div class="row-amount">{{ balance() | number: amountFormat() }} {{ symbol() }}</div>
  </div>
</div>
