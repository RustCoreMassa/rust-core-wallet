<div class="row">
  <app-token-icon [src]="token().asset" [symbol]="symbol()" />
  <div class="row-main">
    <div class="row-name">{{ token().name }}</div>
    <div class="row-sub">
      @if (hasPrice()) {
      {{ priceText() }}
      } @else {
      {{ symbol() }}
      }
      @if (token().custom) {
      <span class="custom-tag">Added by you</span>
      }
    </div>
  </div>
  <div class="row-values">
    <div class="row-usd">{{ balance() | amount }} {{ symbol() }}</div>
    <div class="row-amount">
      @if (hasPrice()) {
      {{ usdValue() | currency: 'USD' : 'symbol' : '1.2-2' }}
      } @else {
      —
      }
    </div>
  </div>
</div>
