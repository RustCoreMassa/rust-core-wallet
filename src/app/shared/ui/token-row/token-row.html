<div class="row">
  @if (iconFailed()) {
  <div class="row-icon mas">{{ symbol().slice(0, 4) }}</div>
  } @else {
  <img class="row-icon" [src]="meta().asset" [alt]="symbol()" (error)="iconFailed.set(true)" />
  }
  <div class="row-main">
    <div class="row-name">{{ meta().name }}</div>
    <div class="row-sub">
      @if (hasPrice()) {
      {{ priceText() }}
      } @else {
      {{ symbol() }}
      }
    </div>
  </div>
  <div class="row-values">
    <div class="row-usd">
      @if (hasPrice()) {
      {{ usdValue() | currency: 'USD' : 'symbol' : '1.2-2' }}
      } @else {
      —
      }
    </div>
    <div class="row-amount">{{ balance() | number: amountFormat() }} {{ symbol() }}</div>
  </div>
</div>
