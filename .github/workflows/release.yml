# Publishes a GitHub Release when a version tag is pushed:
#
#   git tag v1.2.3 && git push origin v1.2.3
#
# The release gets the notes for that version from CHANGELOG.md, the production
# build as a zip and a SHA256SUMS file, plus the browser extension (one zip for
# Chromium browsers, one for Firefox, each with its SHA256SUMS) — built here, in
# public CI, from exactly the tagged commit, so anyone can check that what they
# run matches the source (see docs/RELEASING.md).
#
# Only first-party actions are used (actions/checkout, actions/setup-node,
# actions/upload-artifact, actions/download-artifact), pinned to commits, plus the
# GitHub CLI preinstalled on the runner — nothing third-party touches the build of
# a wallet.
#
# Two jobs, so that no code from the dependencies ever runs next to a token that
# can write to the repository: `build` installs, tests and builds with a read-only
# token and no credentials left in the checkout; `publish` only uploads the files
# `build` produced — it checks nothing out and runs no npm.

name: Release

on:
  push:
    tags:
      - 'v*.*.*'

# Nothing by default: each job asks for what it needs.
permissions: {}

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      TAG: ${{ github.ref_name }}

    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0 (pinned: a moved tag cannot change the release build)
        with:
          fetch-depth: 0 # all tags, to compare with earlier releases
          persist-credentials: false # no token left in .git/config for later steps to read

      - name: Set up Node.js (version pinned in .nvmrc)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Tag must match package.json version
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::Tag $TAG does not match package.json version $VERSION (expected v$VERSION)."
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Release must not exist yet
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "::error::A release for $TAG already exists. Bump the version for a new release."
            exit 1
          fi

      - name: Version must be higher than every earlier release
        run: |
          # Numeric semver comparison (as text, v1.10.0 would sort below v1.9.0).
          git tag --list 'v*' | node -e '
            const current = process.env.TAG;
            const parse = (t) => t.slice(1).split(".").map(Number);
            const newer = (a, b) => a[0] - b[0] || a[1] - b[1] || a[2] - b[2];
            const earlier = require("fs").readFileSync(0, "utf8").split("\n")
              .filter((t) => /^v\d+\.\d+\.\d+$/.test(t) && t !== current);
            const latest = earlier.sort((a, b) => newer(parse(a), parse(b))).at(-1);
            if (latest && newer(parse(current), parse(latest)) <= 0) {
              console.log(`::error::${current} is not higher than the latest release ${latest}.`);
              process.exit(1);
            }
            console.log(`${current} > ${latest ?? "(first release)"} — ok`);
          '

      - name: Release notes must exist in CHANGELOG.md
        run: |
          # The section from "## [X.Y.Z]" up to the next "## [" heading.
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::CHANGELOG.md has no \"## [$VERSION]\" section."
            exit 1
          fi
          # Drop link-reference lines ("[1.0.0]: https://…") that belong to the file, not the notes.
          sed -i '/^\[[0-9][^]]*\]: /d' release-notes.md
          cat release-notes.md

      - name: Install exact dependencies
        # Without the packages' own install scripts (none is needed for the build, which comes out
        # byte-identical); then the project's own postinstall, which trims massa-web3.
        run: |
          npm ci --ignore-scripts
          node scripts/trim-massa-web3.mjs

      - name: Run the tests
        run: npx ng test --watch=false

      - name: Production build
        run: npx ng build

      - name: The built app must boot
        # Loads the production bundle in a simulated phone browser and checks the app renders —
        # catches bundle-order bugs that type-checks and unit tests can't see.
        run: npm run smoke

      - name: Browser extension build
        run: npm run build:extension

      - name: The extension must boot
        run: npm run smoke:extension

      - name: Package the build and checksums
        run: |
          mkdir release
          OUT="$PWD/release"
          BUILD=dist/rust-core-wallet/browser
          WEB_ZIP="rust-core-wallet-$TAG.zip"
          # ngsw.json records the build time, so it's the one file left out of the
          # reproducible checksums (see docs/RELEASING.md).
          (cd "$BUILD" && find . -type f ! -name ngsw.json | sort | xargs sha256sum) > "$OUT/SHA256SUMS"
          # Never name a variable ZIP: zip reads $ZIP as default options, so exporting it made
          # every later `zip` call add to that archive instead of writing its own (v1.1.0).
          (cd "$BUILD" && zip -qr "$OUT/$WEB_ZIP" .)
          (cd "$OUT" && sha256sum "$WEB_ZIP") >> "$OUT/SHA256SUMS"
          mv release-notes.md "$OUT/"
          cat "$OUT/SHA256SUMS"

      - name: Package the extension and checksums
        run: |
          # The two folders differ only in manifest.json, so each gets its own SHA256SUMS.
          OUT="$PWD/release"
          for TARGET in chromium firefox; do
            DIR="dist/extension/$TARGET"
            EXT_ZIP="rustcore-wallet-extension-$TARGET-$TAG.zip"
            (cd "$DIR" && find . -type f | sort | xargs sha256sum) > "$OUT/SHA256SUMS-$TARGET"
            (cd "$DIR" && zip -qr "$OUT/$EXT_ZIP" .)
            if [ ! -f "$OUT/$EXT_ZIP" ]; then
              echo "::error::$EXT_ZIP was not created in $OUT."
              ls -la "$OUT"
              exit 1
            fi
            (cd "$OUT" && sha256sum "$EXT_ZIP") >> "$OUT/SHA256SUMS-$TARGET"
            cat "$OUT/SHA256SUMS-$TARGET"
          done

      - name: Hand the release files to the publish job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-files
          path: release/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the release and upload its files
    env:
      TAG: ${{ github.ref_name }}

    steps:
      - name: Take the files the build job produced
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-files
          path: release

      - name: Publish the GitHub Release
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" \
            "rust-core-wallet-$TAG.zip" SHA256SUMS \
            "rustcore-wallet-extension-chromium-$TAG.zip" SHA256SUMS-chromium \
            "rustcore-wallet-extension-firefox-$TAG.zip" SHA256SUMS-firefox \
            --repo "$GITHUB_REPOSITORY" \
            --title "RustCore Wallet $TAG" \
            --notes-file release-notes.md \
            --verify-tag
